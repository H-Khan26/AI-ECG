<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Timeline diagram. v1 UCLA ICI cohort: ECGs from 4 years before to 30 days after ICI start, so the window crosses the index; outcome is the CTRCD registry label. v2 planned open-data replication: baseline window 365 days to 0 days before the index containing a baseline echo with LVEF at least 50 percent and the last ECG before the index as model input; index event at t = 0 (drug start, surgery or admission); outcome window 30 to 365 days after with a later echo showing LVEF at most 40 percent or a drop of at least 10 points. Data: MIMIC-IV-ECG, MIMIC-IV hosp and MIMIC-IV-ECHO.">
<title>v1 and v2 study design</title>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;font-size:15px}.fx{animation:fi .7s ease-out both}.d1{animation-delay:.15s}.d2{animation-delay:.75s}.d3{animation-delay:1.35s}.d4{animation-delay:1.95s}@keyframes fi{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion: reduce){.fx{animation:none!important}.flow{display:none}}</style>
