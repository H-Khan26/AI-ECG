<text class="sans" x="537.6" y="102" font-size="17" font-weight="600" fill="#e6edf3">Normalise</text>
<text class="sans" x="537.6" y="132" font-size="15" fill="#9198a1">FIR-decimate</text>
<text class="sans" x="537.6" y="152" font-size="15" fill="#9198a1">500 → 250 Hz;</text>
<text class="sans" x="537.6" y="172" font-size="15" fill="#9198a1">I, II, V1–V6</text>
<path d="M538.6 192.5H661.4" stroke="#30363d"/>
<text class="mono" x="537.6" y="218" font-size="15" font-weight="600" fill="#e6edf3">8 × 2500</text>
<text class="mono" x="537.6" y="238" font-size="15" fill="#9198a1">@ 250 Hz</text>
