<text class="sans" x="362.7" y="102" font-size="17" font-weight="600" fill="#e6edf3">Quality control</text>
<text class="sans" x="362.7" y="132" font-size="15" fill="#9198a1">Byte and sample</text>
<text class="sans" x="362.7" y="152" font-size="15" fill="#9198a1">checks, clamp,</text>
<text class="sans" x="362.7" y="172" font-size="15" fill="#9198a1">paced removed</text>
<path d="M363.7 192.5H486.6" stroke="#30363d"/>
<text class="mono" x="362.7" y="218" font-size="15" font-weight="600" fill="#e6edf3">byte · sample</text>
<text class="mono" x="362.7" y="238" font-size="15" fill="#9198a1">limit · paced</text>
<path d="M503.6 153.0H517.6" stroke="#30363d" stroke-width="2"/>
