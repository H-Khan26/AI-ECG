<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="532" viewBox="0 0 1200 532" role="img" aria-labelledby="t d">
<title id="t">AI-ECG v1 data pipeline</title>
<desc id="d">Seven stages from a 30,000+ record ECG archive to a model-ready cohort of 718 ECGs from 960 patients (86 CTRCD, 632 control), with a log-scale strip of data volume.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style>
<rect width="1200" height="532" fill="#0d1117"/>
<text class="mono" x="0" y="20" font-size="15" letter-spacing="1.6" fill="#9198a1">V1 DATA PIPELINE · UCLA HEALTH</text>
<text class="mono" x="1198" y="20" font-size="15" text-anchor="end" fill="#6e7681">XML archive → model-ready cohort</text>
<rect x="0.5" y="46.5" width="149.9" height="213" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="13" y="76" font-size="15" fill="#6e7681">01</text>
<text class="sans" x="13" y="102" font-size="17" font-weight="600" fill="#e6edf3">Archive</text>
<text class="sans" x="13" y="132" font-size="15" fill="#9198a1">GE MUSE-style</text>
<text class="sans" x="13" y="152" font-size="15" fill="#9198a1">XML ECG files</text>
<path d="M14 192.5H136.9" stroke="#30363d"/>
<text class="mono" x="13" y="218" font-size="15" font-weight="600" fill="#e6edf3">30,000+</text>
<text class="mono" x="13" y="238" font-size="15" fill="#9198a1">records</text>
<path d="M153.9 153.0H167.9" stroke="#30363d" stroke-width="2"/>
<path class="flow" d="M153.9 153.0H167.9" stroke="#3987e5" stroke-width="2" stroke-dasharray="3 7"/>
<path d="M165.9 148.5L171.9 153.0L165.9 157.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="175.4" y="46.5" width="149.9" height="213" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="mono" x="187.9" y="76" font-size="15" fill="#6e7681">02</text>
<text class="sans" x="187.9" y="102" font-size="17" font-weight="600" fill="#e6edf3">Decode</text>
<text class="sans" x="187.9" y="132" font-size="15" fill="#9198a1">Base64 → int16;</text>
<text class="sans" x="187.9" y="152" font-size="15" fill="#9198a1">8 leads × 2 sets</text>
<text class="sans" x="187.9" y="172" font-size="15" fill="#9198a1">(median, rhythm)</text>
<path d="M188.9 192.5H311.7" stroke="#30363d"/>
<text class="mono" x="187.9" y="218" font-size="15" font-weight="600" fill="#e6edf3">20,000+</text>
<text class="mono" x="187.9" y="238" font-size="15" fill="#9198a1">XMLs decoded</text>
<path d="M328.7 153.0H342.7" stroke="#30363d" stroke-width="2"/>
<path class="flow" d="M328.7 153.0H342.7" stroke="#3987e5" stroke-width="2" stroke-dasharray="3 7"/>
<path d="M340.7 148.5L346.7 153.0L340.7 157.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
